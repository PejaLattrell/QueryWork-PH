name: goodjob-platform
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/goodjob-trigger
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 25s
      start_period: 15s
      retries: 3
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.23.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only service_role JWT in .env}
      FX_USD_RATES: ${FX_USD_RATES:-}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
